# Local development services for EDU-FORUM.
# Start: pnpm infra:up   Stop: pnpm infra:down
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: eduforum
      POSTGRES_PASSWORD: eduforum
      POSTGRES_DB: eduforum
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eduforum']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  # S3-compatible private bucket (stand-in for Cloudflare R2). Console: http://localhost:9001
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: eduforum
      MINIO_ROOT_PASSWORD: eduforum-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

  # Creates the private bucket once MinIO is up.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 eduforum eduforum-secret; do sleep 2; done;
      mc mb --ignore-existing local/eduforum-private;
      mc anonymous set none local/eduforum-private;
      exit 0;
      "

  # Virus scanner (clamd on port 3310). First start downloads signatures and takes a few minutes.
  clamav:
    image: clamav/clamav:stable
    ports:
      - '3310:3310'

  # Catches all outgoing email in development. Inbox UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
  miniodata:
