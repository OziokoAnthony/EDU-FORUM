# Local development services for EDU-FORUM.
# Start: pnpm infra:up   Stop: pnpm infra:down
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: eduforum
      POSTGRES_PASSWORD: eduforum
      POSTGRES_DB: eduforum
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eduforum']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  # Virus scanner (clamd on port 3310). First start downloads signatures and takes a few minutes.
  clamav:
    image: clamav/clamav:stable
    ports:
      - '3310:3310'

  # Converts DOC/DOCX CVs to PDF for the CV viewer (LibreOffice behind an HTTP API).
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - '3100:3000'

  # Catches all outgoing email in development. Inbox UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
